<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="hotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="coldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="860" rx="16" fill="url(#bgGrad5)"/>
  <rect x="2" y="2" width="1196" height="856" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="1080" height="70" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="540" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">WALLET ARCHITECTURE, SECURE ELEMENT &amp; RISK TIERING</text>
    <text x="540" y="52" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Three-Tier Custodial Hierarchy, Air-Gapped Cryptographic Signing, and Physical Backup Durability</text>
  </g>

  <!-- Left Side: 3-Tier Asset Allocation Pyramid (Custody Tiering) -->
  <g transform="translate(60, 120)" filter="url(#shadow5)">
    <rect x="0" y="0" width="480" height="490" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="240" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Three-Tier Custodial Asset Allocation</text>
    
    <!-- Tier 1: Hot Wallet (Top) -->
    <g transform="translate(30, 60)">
      <polygon points="210 0, 80 100, 340 100" fill="url(#hotGrad)" stroke="#F87171" stroke-width="1.5"/>
      <text x="210" y="50" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">HOT WALLET (~5%)</text>
      <text x="210" y="68" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Daily Spending / dApps</text>
      <text x="210" y="84" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">MetaMask, Phantom, Mobile</text>
    </g>

    <!-- Tier 2: Warm Wallet (Middle) -->
    <g transform="translate(30, 165)">
      <polygon points="80 0, 340 0, 390 90, 30 90" fill="url(#warmGrad)" stroke="#FBBF24" stroke-width="1.5"/>
      <text x="210" y="38" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">WARM WALLET (~15% - 20%)</text>
      <text x="210" y="56" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Active Trading &amp; DeFi Staking</text>
      <text x="210" y="72" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Desktop Client + Multisig (Safe)</text>
    </g>

    <!-- Tier 3: Cold Storage (Base) -->
    <g transform="translate(30, 260)">
      <polygon points="30 0, 390 0, 420 100, 0 100" fill="url(#coldGrad)" stroke="#34D399" stroke-width="1.5"/>
      <text x="210" y="40" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">COLD STORAGE (~75% - 80%)</text>
      <text x="210" y="58" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Long-Term Wealth Reserves (HODL)</text>
      <text x="210" y="74" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Hardware Wallets (Ledger/Trezor), Steel Plates</text>
    </g>

    <!-- Key Takeaway Box -->
    <g transform="translate(25, 385)">
      <rect x="0" y="0" width="430" height="85" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Diversification &amp; Segregation Rule:</text>
      <text x="14" y="42" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Never connect Cold Storage to untested Web3 dApps.</text>
      <text x="14" y="60" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Limit Hot Wallet exposure to what you can afford to lose.</text>
      <text x="14" y="78" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Rebalance assets periodically between tiers.</text>
    </g>
  </g>

  <!-- Right Side: Hardware Wallet Architecture & Air-Gapped Signing -->
  <g transform="translate(570, 120)" filter="url(#shadow5)">
    <rect x="0" y="0" width="570" height="490" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="285" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Secure Element Hardware Architecture &amp; Isolated Signing</text>

    <!-- Untrusted Host PC Box -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="220" height="180" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
      <rect x="0" y="0" width="220" height="28" rx="8" fill="#7F1D1D"/>
      <text x="110" y="19" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">&#9888; UNTRUSTED HOST PC</text>
      <text x="12" y="50" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">&#8226; Windows / macOS OS</text>
      <text x="12" y="70" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">&#8226; Internet-connected</text>
      <text x="12" y="90" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">&#8226; Potential malware/keyloggers</text>
      <text x="12" y="110" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">&#8226; Web3 Wallet Extension</text>
      
      <!-- Unsigned Tx -->
      <g transform="translate(10, 130)">
        <rect x="0" y="0" width="200" height="36" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
        <text x="100" y="16" fill="#FDE68A" font-family="monospace" font-size="9.5" text-anchor="middle">1. Builds Unsigned Tx</text>
        <text x="100" y="29" fill="#94A3B8" font-family="monospace" font-size="8.5" text-anchor="middle">(To: 0xBob, Amount: 1 ETH)</text>
      </g>
    </g>

    <!-- Communication Bridge (Air-Gap / USB) -->
    <g transform="translate(250, 100)">
      <path d="M 0 35 L 50 35" fill="none" stroke="#38BDF8" stroke-width="2"/>
      <text x="25" y="25" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">USB / QR</text>
      
      <path d="M 50 65 L 0 65" fill="none" stroke="#10B981" stroke-width="2"/>
      <text x="25" y="80" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Signature</text>
    </g>

    <!-- Trusted Hardware Wallet Enclosure -->
    <g transform="translate(305, 55)">
      <rect x="0" y="0" width="240" height="310" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
      <rect x="0" y="0" width="240" height="28" rx="10" fill="url(#coldGrad)"/>
      <text x="120" y="19" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">&#128274; HARDWARE WALLET (ISOLATED)</text>

      <!-- OLED Screen Display -->
      <g transform="translate(20, 40)">
        <rect x="0" y="0" width="200" height="60" rx="6" fill="#022C22" stroke="#059669" stroke-width="1"/>
        <text x="100" y="18" fill="#6EE7B7" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">SECURE OLED DISPLAY</text>
        <text x="100" y="34" fill="#A7F3D0" font-family="monospace" font-size="8.5" text-anchor="middle">Send 1.00 ETH</text>
        <text x="100" y="48" fill="#A7F3D0" font-family="monospace" font-size="8.5" text-anchor="middle">To: 0xBob...4F9</text>
      </g>

      <!-- Physical Buttons -->
      <g transform="translate(45, 110)">
        <rect x="0" y="0" width="70" height="26" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="35" y="17" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">&#10005; Reject</text>

        <rect x="80" y="0" width="70" height="26" rx="4" fill="#065F46" stroke="#10B981" stroke-width="1"/>
        <text x="115" y="17" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">&#10003; Confirm</text>
      </g>

      <!-- Secure Element Chip -->
      <g transform="translate(20, 150)">
        <rect x="0" y="0" width="200" height="135" rx="8" fill="url(#chipGrad)" stroke="#60A5FA" stroke-width="1.5"/>
        <text x="100" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SECURE ELEMENT (EAL6+)</text>
        <text x="100" y="40" fill="#DBEAFE" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Tamper-Proof Silicon Vault</text>
        
        <rect x="15" y="52" width="170" height="42" rx="4" fill="#1E293B" stroke="#93C5FD" stroke-width="1"/>
        <text x="85" y="68" fill="#FDE68A" font-family="monospace" font-size="9" text-anchor="middle">&#128273; Master Private Key (Seed)</text>
        <text x="85" y="82" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">NEVER LEAVES THIS CHIP!</text>

        <text x="100" y="112" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">Calculates ECDSA / Ed25519 signature internally.</text>
        <text x="100" y="125" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">Returns ONLY the digital signature (r, s, v).</text>
      </g>
    </g>

    <!-- Bottom Architectural Summary -->
    <g transform="translate(25, 385)">
      <rect x="0" y="0" width="520" height="85" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">The Golden Law of Hardware Wallets:</text>
      <text x="14" y="42" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Even if the host computer is infected with Pegasus spyware, remote keyloggers, or clipboard clippers, the private key cannot be extracted because signing occurs strictly inside the isolated EAL6+ silicon boundary.</text>
    </g>
  </g>

  <!-- Bottom Panel: Physical Backup Engineering & Shamir's Secret Sharing -->
  <g transform="translate(60, 630)" filter="url(#shadow5)">
    <rect x="0" y="0" width="1080" height="200" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="540" y="26" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Seed Phrase Physical Storage Engineering &amp; Shamir's Split Backups</text>

    <!-- Sub-card 1: Paper vs Metal Backup -->
    <g transform="translate(25, 42)">
      <rect x="0" y="0" width="495" height="135" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Paper Wallets vs. Stainless Steel Backups</text>
      <text x="16" y="44" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; <tspan fill="#EF4444" font-weight="600">Paper Backup:</tspan> Highly fragile. Destructible by water, house fire, ink fading, insects, or accidental disposal.</text>
      <text x="16" y="74" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; <tspan fill="#34D399" font-weight="600">304/316 Marine-Grade Steel Plates (Cryptosteel):</tspan> Fireproof up to 1400&#176;C, waterproof, rust-proof, resistant to building collapse.</text>
      <text x="16" y="104" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; <tspan fill="#38BDF8" font-weight="600">Passphrase (BIP-39 25th Word):</tspan> Adds an extra secret word to the seed, creating a hidden decoy wallet for $5 wrench defense.</text>
    </g>

    <!-- Sub-card 2: Shamir's Secret Sharing (SLIP-0039) -->
    <g transform="translate(545, 42)">
      <rect x="0" y="0" width="510" height="135" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Shamir's Secret Sharing (SLIP-0039 / SSS 3-of-5 Scheme)</text>
      <text x="16" y="44" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Mathematically splits master seed into 5 distinct cryptographic shares.</text>
      <text x="16" y="66" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Any <tspan fill="#FDE68A" font-weight="700">3 shares</tspan> reconstruct the original seed; 1 or 2 shares leak zero information.</text>
      <text x="16" y="88" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; <tspan fill="#38BDF8" font-weight="600">Geographic Distribution:</tspan> Share 1 (Home Safe), Share 2 (Bank Vault A), Share 3 (Bank Vault B), Share 4 (Lawyer), Share 5 (Trusted Relative).</text>
      <text x="16" y="112" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">&#10003; Eliminates both Single Point of Failure (loss) and Single Point of Compromise (theft).</text>
    </g>
  </g>
</svg>