<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1090" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#glow2)"/>
  <text x="575" y="48" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Hierarchical Deterministic (HD) Wallet Architecture (BIP32 / BIP39 / BIP44)</text>
  <text x="575" y="72" fill="#94a3b8" font-size="13" text-anchor="middle">From Cryptographic Entropy to Branching Key Trees: m / purpose&apos; / coin_type&apos; / account&apos; / change / address_index</text>

  <!-- Level 0: Entropy & Seed Phrase -->
  <g transform="translate(60, 105)" filter="url(#glow2)">
    <!-- Entropy Box -->
    <rect x="0" y="0" width="220" height="85" rx="8" fill="url(#cardGrad2)" stroke="#f59e0b" stroke-width="2"/>
    <text x="110" y="26" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">ROOT ENTROPY</text>
    <text x="110" y="48" fill="#f8fafc" font-size="11" text-anchor="middle">128 - 256 bits of randomness</text>
    <text x="110" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">(Dice rolls, CSPRNG, Coin flips)</text>

    <!-- Arrow -->
    <path d="M 220 42 L 275 42" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- Mnemonic Box -->
    <rect x="285" y="0" width="250" height="85" rx="8" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="2"/>
    <text x="410" y="26" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">BIP39 MNEMONIC PHRASE</text>
    <text x="410" y="48" fill="#f8fafc" font-size="11" text-anchor="middle">12, 18, or 24 English Words</text>
    <text x="410" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">(From standardized 2048 wordlist)</text>

    <!-- Arrow -->
    <path d="M 535 42 L 590 42" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="562" y="32" fill="#38bdf8" font-size="9" text-anchor="middle">PBKDF2</text>

    <!-- 512-bit Seed Box -->
    <rect x="600" y="0" width="200" height="85" rx="8" fill="url(#cardGrad2)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="700" y="26" fill="#c4b5fd" font-size="12" font-weight="bold" text-anchor="middle">512-BIT BINARY SEED</text>
    <text x="700" y="48" fill="#f8fafc" font-size="11" text-anchor="middle">HMAC-SHA512 + Salt</text>
    <text x="700" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">Optional Passphrase</text>

    <!-- Arrow -->
    <path d="M 800 42 L 855 42" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- Master Key Box -->
    <rect x="865" y="0" width="220" height="85" rx="8" fill="url(#cardGrad2)" stroke="#3b82f6" stroke-width="2"/>
    <text x="975" y="26" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">BIP32 MASTER NODE (m)</text>
    <text x="975" y="48" fill="#f8fafc" font-size="11" text-anchor="middle">Master PrivKey (256b)</text>
    <text x="975" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">+ Master Chain Code (256b)</text>
  </g>

  <!-- Branching Down to BIP44 Path Tree -->
  <path d="M 1035 190 L 1035 215 L 575 215 L 575 240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="575" y="232" fill="#38bdf8" font-size="11" text-anchor="middle">BIP44 Standard Tree Derivation: m / purpose&apos; / coin_type&apos; / account&apos; / change / address_index</text>

  <!-- Level 1: Purpose (44') -->
  <g transform="translate(425, 245)" filter="url(#glow2)">
    <rect width="300" height="60" rx="8" fill="url(#cardGrad2)" stroke="#6366f1" stroke-width="2"/>
    <text x="150" y="26" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">LEVEL 1: PURPOSE = 44&apos; (Hardened)</text>
    <text x="150" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">Defines structure as BIP44 multi-account hierarchy</text>
  </g>

  <!-- Arrow Level 1 to Level 2 -->
  <path d="M 575 305 L 575 335" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Level 2: Coin Type (0' for BTC, 1' for Testnet) -->
  <g transform="translate(375, 340)" filter="url(#glow2)">
    <rect width="400" height="60" rx="8" fill="url(#cardGrad2)" stroke="#ec4899" stroke-width="2"/>
    <text x="200" y="26" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle">LEVEL 2: COIN TYPE = 0&apos; (Bitcoin Mainnet, Hardened)</text>
    <text x="200" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">SLIP-0044 registered (0&apos;=BTC, 1&apos;=Testnet, 60&apos;=ETH)</text>
  </g>

  <!-- Arrow Level 2 to Level 3 -->
  <path d="M 575 400 L 575 430" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Level 3: Accounts (Account 0' and Account 1') -->
  <g transform="translate(180, 435)" filter="url(#glow2)">
    <!-- Account 0' -->
    <rect x="0" y="0" width="370" height="70" rx="8" fill="url(#cardGrad2)" stroke="#0ea5e9" stroke-width="2"/>
    <text x="185" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">ACCOUNT 0&apos; (Hardened)</text>
    <text x="185" y="46" fill="#f8fafc" font-size="10" text-anchor="middle">Primary Business / Personal Vault</text>
    <text x="185" y="60" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">Derives xpub0 (Auditing / Watch-Only)</text>

    <!-- Account 1' -->
    <rect x="420" y="0" width="370" height="70" rx="8" fill="url(#cardGrad2)" stroke="#0ea5e9" stroke-width="2"/>
    <text x="605" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">ACCOUNT 1&apos; (Hardened)</text>
    <text x="605" y="46" fill="#f8fafc" font-size="10" text-anchor="middle">Secondary Vault / Escrow Account</text>
    <text x="605" y="60" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">Derives xpub1 (Auditing / Watch-Only)</text>
  </g>

  <!-- Connector from Account 0' to Change Branches -->
  <path d="M 365 505 L 365 535" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 230 535 L 500 535" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 230 535 L 230 555" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M 500 535 L 500 555" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Level 4: Change Chains (External 0 vs Internal 1) -->
  <g transform="translate(100, 560)" filter="url(#glow2)">
    <!-- External Chain 0 -->
    <rect x="0" y="0" width="260" height="60" rx="8" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="25" fill="#6ee7b7" font-size="11" font-weight="bold" text-anchor="middle">CHANGE = 0 (External Chain)</text>
    <text x="130" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Public-facing receiving addresses</text>

    <!-- Internal Chain 1 -->
    <rect x="280" y="0" width="260" height="60" rx="8" fill="url(#cardGrad2)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="410" y="25" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">CHANGE = 1 (Internal Chain)</text>
    <text x="410" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Change back to self from transactions</text>

    <!-- Explanation Box on right -->
    <rect x="580" y="-10" width="410" height="180" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="785" y="15" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">SECURITY ADVANTAGES OF HD WALLETS</text>
    <text x="600" y="40" fill="#cbd5e1" font-size="11">&#8226; <tspan fill="#38bdf8" font-weight="bold">Single Backup:</tspan> One seed phrase restores infinite keys</text>
    <text x="600" y="65" fill="#cbd5e1" font-size="11">&#8226; <tspan fill="#10b981" font-weight="bold">Watch-Only (XPUB):</tspan> Web servers derive addresses without</text>
    <text x="612" y="82" fill="#94a3b8" font-size="10">exposing private keys (cannot spend funds).</text>
    <text x="600" y="105" fill="#cbd5e1" font-size="11">&#8226; <tspan fill="#f59e0b" font-weight="bold">Hardened Keys (&apos;):</tspan> Prevents child key leak from compromising</text>
    <text x="612" y="122" fill="#94a3b8" font-size="10">parent keys by using private key in HMAC input.</text>
    <text x="600" y="145" fill="#cbd5e1" font-size="11">&#8226; <tspan fill="#ec4899" font-weight="bold">Privacy:</tspan> New address generated for every single transaction.</text>
  </g>

  <!-- Connectors to Leaf Addresses -->
  <path d="M 230 620 L 230 650" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 120 650 L 340 650" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 120 650 L 120 665" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M 230 650 L 230 665" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M 340 650 L 340 665" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Level 5: Address Indices -->
  <g transform="translate(60, 670)" filter="url(#glow2)">
    <rect x="0" y="0" width="115" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="57" y="22" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Index 0 (m/44&apos;/0&apos;/0&apos;/0/0)</text>
    <text x="57" y="42" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Address #1</text>

    <rect x="125" y="0" width="115" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="182" y="22" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Index 1 (m/44&apos;/0&apos;/0&apos;/0/1)</text>
    <text x="182" y="42" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Address #2</text>

    <rect x="250" y="0" width="115" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="307" y="22" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Index 2 (m/44&apos;/0&apos;/0&apos;/0/2)</text>
    <text x="307" y="42" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Address #3...</text>
  </g>

</svg>