<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background:#0b1329; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1070" height="65" rx="10" fill="url(#headerGrad2)" filter="url(#shadow2)" />
  <text x="575" y="55" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Smart Contract Lifecycle &amp; Compilation Pipeline</text>
  <text x="575" y="76" fill="#c7d2fe" font-size="13" text-anchor="middle">From Solidity Source (.sol) to Solc Compiler, ABI/Bytecode, EVM Deployment &amp; State Mutation</text>

  <!-- STAGE 1: Solidity Source Code -->
  <rect x="40" y="115" width="220" height="625" rx="10" fill="url(#boxGrad1)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow2)" />
  <rect x="55" y="130" width="190" height="36" rx="6" fill="#4338ca" />
  <text x="150" y="153" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">1. Source Code (.sol)</text>

  <rect x="55" y="180" width="190" height="230" rx="8" fill="#1e1e38" stroke="#818cf8" stroke-width="1" />
  <text x="65" y="202" fill="#a5b4fc" font-size="11" font-weight="700">// Contract Elements</text>
  <text x="65" y="222" fill="#38bdf8" font-size="10.5" font-family="monospace">// SPDX-License: MIT</text>
  <text x="65" y="240" fill="#f43f5e" font-size="10.5" font-family="monospace">pragma solidity ^0.8.20;</text>
  <text x="65" y="260" fill="#34d399" font-size="10.5" font-family="monospace">contract TokenAuction {</text>
  <text x="75" y="278" fill="#fbbf24" font-size="10" font-family="monospace">address public owner;</text>
  <text x="75" y="294" fill="#fbbf24" font-size="10" font-family="monospace">mapping(address=&gt;uint)</text>
  <text x="85" y="308" fill="#fbbf24" font-size="10" font-family="monospace">  public bids;</text>
  <text x="75" y="326" fill="#e0e7ff" font-size="10" font-family="monospace">constructor() {</text>
  <text x="85" y="342" fill="#cbd5e1" font-size="10" font-family="monospace">  owner = msg.sender;</text>
  <text x="75" y="358" fill="#e0e7ff" font-size="10" font-family="monospace">}</text>
  <text x="75" y="376" fill="#38bdf8" font-size="10" font-family="monospace">function bid() payable{..}</text>
  <text x="65" y="394" fill="#34d399" font-size="10.5" font-family="monospace">}</text>

  <rect x="55" y="425" width="190" height="150" rx="8" fill="#1e1e38" stroke="#818cf8" stroke-width="1" />
  <text x="150" y="447" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">Language Constructs</text>
  <text x="65" y="468" fill="#cbd5e1" font-size="10.5">• State vs Local Variables</text>
  <text x="65" y="488" fill="#cbd5e1" font-size="10.5">• Visibility: pub/priv/ext/int</text>
  <text x="65" y="508" fill="#cbd5e1" font-size="10.5">• Mutability: view / pure / pay</text>
  <text x="65" y="528" fill="#cbd5e1" font-size="10.5">• Custom Modifiers &amp; Events</text>
  <text x="65" y="548" fill="#cbd5e1" font-size="10.5">• SafeMath (Checked 0.8+)</text>
  <text x="65" y="565" fill="#cbd5e1" font-size="10.5">• require(), revert(), assert()</text>

  <rect x="55" y="590" width="190" height="135" rx="8" fill="#1e1e38" stroke="#818cf8" stroke-width="1" />
  <text x="150" y="612" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">Remix IDE Tooling</text>
  <text x="65" y="632" fill="#cbd5e1" font-size="10.5">• In-browser Monaco Editor</text>
  <text x="65" y="650" fill="#cbd5e1" font-size="10.5">• Compiler tab: Version match</text>
  <text x="65" y="668" fill="#cbd5e1" font-size="10.5">• Run tab: VM vs Injected</text>
  <text x="65" y="686" fill="#cbd5e1" font-size="10.5">• Gas estimate &amp; Debugger</text>
  <text x="65" y="704" fill="#cbd5e1" font-size="10.5">• Static code analysis</text>

  <!-- Connection 1 -> 2 -->
  <path d="M 260 360 L 300 360" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrowIndigo)" />
  <text x="280" y="350" fill="#818cf8" font-size="10" font-weight="700" text-anchor="middle">solc</text>

  <!-- STAGE 2: Compilation & Artifacts -->
  <rect x="305" y="115" width="245" height="625" rx="10" fill="url(#boxGrad1)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow2)" />
  <rect x="320" y="130" width="215" height="36" rx="6" fill="#0284c7" />
  <text x="427" y="153" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">2. Compiler Artifacts</text>

  <!-- ABI Box -->
  <rect x="320" y="180" width="215" height="235" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
  <text x="427" y="202" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">Application Binary Interface</text>
  <text x="427" y="218" fill="#94a3b8" font-size="10.5" text-anchor="middle">(JSON Schema for RPC Calls)</text>
  <rect x="330" y="230" width="195" height="175" rx="6" fill="#031f33" />
  <text x="338" y="248" fill="#7dd3fc" font-size="9.5" font-family="monospace">[</text>
  <text x="344" y="263" fill="#7dd3fc" font-size="9.5" font-family="monospace">  { "type": "function",</text>
  <text x="344" y="278" fill="#7dd3fc" font-size="9.5" font-family="monospace">    "name": "bid",</text>
  <text x="344" y="293" fill="#7dd3fc" font-size="9.5" font-family="monospace">    "stateMutability": "payable",</text>
  <text x="344" y="308" fill="#7dd3fc" font-size="9.5" font-family="monospace">    "inputs": [] },</text>
  <text x="344" y="323" fill="#7dd3fc" font-size="9.5" font-family="monospace">  { "type": "function",</text>
  <text x="344" y="338" fill="#7dd3fc" font-size="9.5" font-family="monospace">    "name": "owner",</text>
  <text x="344" y="353" fill="#7dd3fc" font-size="9.5" font-family="monospace">    "outputs": [{"type":"address"}],</text>
  <text x="344" y="368" fill="#7dd3fc" font-size="9.5" font-family="monospace">    "stateMutability": "view" }</text>
  <text x="338" y="383" fill="#7dd3fc" font-size="9.5" font-family="monospace">]</text>

  <!-- Bytecode Box -->
  <rect x="320" y="425" width="215" height="300" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
  <text x="427" y="447" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">EVM Bytecode Split</text>
  
  <rect x="330" y="460" width="195" height="120" rx="6" fill="#031f33" stroke="#f59e0b" stroke-width="1" />
  <text x="427" y="478" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">A. Creation / Init Bytecode</text>
  <text x="338" y="498" fill="#fde68a" font-size="9" font-family="monospace">608060405234801561001057...</text>
  <text x="338" y="515" fill="#cbd5e1" font-size="9.5">• Executes constructor()</text>
  <text x="338" y="530" fill="#cbd5e1" font-size="9.5">• Sets initial storage slots</text>
  <text x="338" y="545" fill="#cbd5e1" font-size="9.5">• Copies runtime code to memory</text>
  <text x="338" y="560" fill="#cbd5e1" font-size="9.5">• RETURN opcode yields runtime</text>

  <rect x="330" y="590" width="195" height="125" rx="6" fill="#031f33" stroke="#10b981" stroke-width="1" />
  <text x="427" y="608" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">B. Runtime Bytecode</text>
  <text x="338" y="626" fill="#a7f3d0" font-size="9" font-family="monospace">6004361061003f5760003560...</text>
  <text x="338" y="643" fill="#cbd5e1" font-size="9.5">• Stored permanently on-chain</text>
  <text x="338" y="658" fill="#cbd5e1" font-size="9.5">• Function Selector Dispatcher</text>
  <text x="338" y="673" fill="#cbd5e1" font-size="9.5">• JUMPDEST, SLOAD, SSTORE</text>
  <text x="338" y="688" fill="#cbd5e1" font-size="9.5">• Handles external calls</text>

  <!-- Connection 2 -> 3 -->
  <path d="M 550 510 L 590 510" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrowIndigo)" />
  <text x="570" y="500" fill="#0ea5e9" font-size="10" font-weight="700" text-anchor="middle">Deploy</text>

  <!-- STAGE 3: Deployment Transaction -->
  <rect x="595" y="115" width="245" height="625" rx="10" fill="url(#boxGrad1)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow2)" />
  <rect x="610" y="130" width="215" height="36" rx="6" fill="#059669" />
  <text x="717" y="153" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">3. Deployment Transaction</text>

  <rect x="610" y="180" width="215" height="195" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="717" y="202" fill="#34d399" font-size="12.5" font-weight="700" text-anchor="middle">Transaction Payload</text>
  <text x="620" y="224" fill="#ecfdf5" font-size="10.5"><tspan font-weight="700">From:</tspan> EOA Address (Deployer)</text>
  <text x="620" y="244" fill="#fbbf24" font-size="10.5"><tspan font-weight="700">To:</tspan> null / 0x0 (Create Flag)</text>
  <text x="620" y="264" fill="#ecfdf5" font-size="10.5"><tspan font-weight="700">Value:</tspan> 0 Wei (or Endowment)</text>
  <text x="620" y="284" fill="#ecfdf5" font-size="10.5"><tspan font-weight="700">Gas Limit:</tspan> 3,000,000</text>
  <text x="620" y="304" fill="#ecfdf5" font-size="10.5"><tspan font-weight="700">Gas Price / Fee:</tspan> Base + Tip</text>
  <text x="620" y="324" fill="#a7f3d0" font-size="10"><tspan font-weight="700">Data:</tspan> Init Bytecode +</text>
  <text x="660" y="338" fill="#a7f3d0" font-size="10">Encoded Constructor Args</text>
  <text x="620" y="358" fill="#ecfdf5" font-size="10.5"><tspan font-weight="700">Signature:</tspan> ECDSA (v, r, s)</text>

  <!-- Contract Address Derivation -->
  <rect x="610" y="390" width="215" height="170" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="717" y="412" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">Deterministic Address Math</text>
  <text x="620" y="433" fill="#cbd5e1" font-size="10">Formula:</text>
  <rect x="618" y="440" width="200" height="32" rx="4" fill="#022c22" />
  <text x="718" y="460" fill="#34d399" font-size="10.5" font-family="monospace" text-anchor="middle">keccak256(RLP(sender, nonce))</text>
  <text x="620" y="490" fill="#cbd5e1" font-size="10">Address = last 20 bytes (160 bits)</text>
  <text x="620" y="508" fill="#cbd5e1" font-size="10">MetaMask / Etherscan check:</text>
  <text x="620" y="525" fill="#7dd3fc" font-size="9" font-family="monospace">0x5B38... sender + Nonce: 0</text>
  <text x="620" y="542" fill="#38bdf8" font-size="9.5" font-weight="700" font-family="monospace">=&gt; 0xd914...2404 (Contract)</text>

  <!-- Testnet / VM Selection -->
  <rect x="610" y="575" width="215" height="150" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="717" y="597" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Target Environments</text>
  <text x="620" y="618" fill="#cbd5e1" font-size="10.5"><tspan font-weight="700">1. Remix VM (London/Shanghai):</tspan></text>
  <text x="635" y="634" fill="#94a3b8" font-size="9.5">Local in-browser simulation, 10 accts</text>
  <text x="620" y="654" fill="#cbd5e1" font-size="10.5"><tspan font-weight="700">2. Injected Provider (MetaMask):</tspan></text>
  <text x="635" y="670" fill="#94a3b8" font-size="9.5">Connects to Sepolia / Holesky / Mainnet</text>
  <text x="620" y="690" fill="#cbd5e1" font-size="10.5"><tspan font-weight="700">3. Hardhat / Ganache Provider:</tspan></text>
  <text x="635" y="706" fill="#94a3b8" font-size="9.5">Custom RPC at http://127.0.0.1:8545</text>

  <!-- Connection 3 -> 4 -->
  <path d="M 840 360 L 880 360" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowEmerald)" />
  <text x="860" y="350" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">Execute</text>

  <!-- STAGE 4: On-Chain Execution & State -->
  <rect x="885" y="115" width="225" height="625" rx="10" fill="url(#boxGrad1)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow2)" />
  <rect x="900" y="130" width="195" height="36" rx="6" fill="#d97706" />
  <text x="997" y="153" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">4. EVM Execution &amp; State</text>

  <!-- EVM Execution -->
  <rect x="900" y="180" width="195" height="195" rx="8" fill="#451a03" stroke="#fbbf24" stroke-width="1" />
  <text x="997" y="202" fill="#fbbf24" font-size="12.5" font-weight="700" text-anchor="middle">Execution Flow</text>
  <text x="910" y="224" fill="#fef3c7" font-size="10">• Push args onto Stack</text>
  <text x="910" y="242" fill="#fef3c7" font-size="10">• Run constructor code</text>
  <text x="910" y="260" fill="#fef3c7" font-size="10">• SSTORE owner address</text>
  <text x="910" y="278" fill="#fef3c7" font-size="10">• Deduct gas per opcode:</text>
  <text x="920" y="295" fill="#fca5a5" font-size="9.5">SSTORE: 20,000 gas</text>
  <text x="920" y="310" fill="#fca5a5" font-size="9.5">MSTORE: 3 gas</text>
  <text x="910" y="328" fill="#fef3c7" font-size="10">• Check gas limit &gt;= consumed</text>
  <text x="910" y="346" fill="#34d399" font-size="10" font-weight="700">• Write Runtime Bytecode</text>
  <text x="910" y="362" fill="#cbd5e1" font-size="9.5">• Emit ContractCreated event</text>

  <!-- Contract Account State -->
  <rect x="900" y="390" width="195" height="180" rx="8" fill="#451a03" stroke="#fbbf24" stroke-width="1" />
  <text x="997" y="412" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">Contract Account Created</text>
  <rect x="908" y="425" width="180" height="135" rx="6" fill="#291201" />
  <text x="918" y="445" fill="#7dd3fc" font-size="10" font-weight="700">Address: 0xd914...</text>
  <text x="918" y="465" fill="#fed7aa" font-size="10">• Nonce = 1</text>
  <text x="918" y="485" fill="#fed7aa" font-size="10">• Balance = msg.value</text>
  <text x="918" y="505" fill="#fed7aa" font-size="10">• CodeHash = keccak256(rt)</text>
  <text x="918" y="525" fill="#fed7aa" font-size="10">• StorageRoot = Merkle Trie</text>
  <text x="928" y="542" fill="#94a3b8" font-size="9.5">Slot 0: owner (address)</text>
  <text x="928" y="555" fill="#94a3b8" font-size="9.5">Slot 1: bids (mapping trie)</text>

  <!-- Post-Deployment Interaction -->
  <rect x="900" y="585" width="195" height="140" rx="8" fill="#451a03" stroke="#fbbf24" stroke-width="1" />
  <text x="997" y="607" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">Subsequent Interactions</text>
  <text x="910" y="628" fill="#cbd5e1" font-size="10"><tspan font-weight="700">1. eth_call (View/Pure):</tspan></text>
  <text x="920" y="644" fill="#94a3b8" font-size="9.5">Simulated locally, 0 gas fee</text>
  <text x="910" y="664" fill="#cbd5e1" font-size="10"><tspan font-weight="700">2. eth_sendTransaction:</tspan></text>
  <text x="920" y="680" fill="#94a3b8" font-size="9.5">Dispatches bid(), mutates</text>
  <text x="920" y="695" fill="#94a3b8" font-size="9.5">StorageRoot, burns Gas</text>
  <text x="920" y="710" fill="#34d399" font-size="9.5">Generates Tx Hash &amp; Receipt</text>
</svg>