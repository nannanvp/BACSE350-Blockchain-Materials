<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arr5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr5-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr5-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1090" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#glow5)"/>
  <text x="575" y="48" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Bitcoin Block Download &amp; Propagation (Gossip Protocol Flow)</text>
  <text x="575" y="72" fill="#94a3b8" font-size="13" text-anchor="middle">Inventory Announcement (inv), Data Request (getdata), Block Transfer, and Relay</text>

  <!-- Node Headers -->
  <g transform="translate(100, 110)">
    <!-- Node A (Miner / Propagator) -->
    <rect x="0" y="0" width="220" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="110" y="25" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Node A (Broadcaster / Miner)</text>
    <text x="110" y="43" fill="#94a3b8" font-size="10" text-anchor="middle">Discovers or receives new Block</text>

    <!-- Node B (Validating Peer) -->
    <rect x="365" y="0" width="220" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="475" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Node B (Validating Peer)</text>
    <text x="475" y="43" fill="#94a3b8" font-size="10" text-anchor="middle">Synchronizing Full Node</text>

    <!-- Node C (Downstream Peers) -->
    <rect x="730" y="0" width="220" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="840" y="25" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">Node C (Downstream Network)</text>
    <text x="840" y="43" fill="#94a3b8" font-size="10" text-anchor="middle">Next Hop Gossip Peers</text>

    <!-- Lifelines -->
    <line x1="110" y1="55" x2="110" y2="600" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="475" y1="55" x2="475" y2="600" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="840" y1="55" x2="840" y2="600" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Step 1: inv Message (A -> B) -->
    <path d="M 110 90 L 475 90" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr5-orange)"/>
    <rect x="180" y="65" width="220" height="48" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="290" y="83" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. &apos;inv&apos; [MSG_BLOCK]</text>
    <text x="290" y="98" fill="#94a3b8" font-size="9" text-anchor="middle">Hash: 00000000000000... (32B hash)</text>
    <text x="290" y="108" fill="#cbd5e1" font-size="8" text-anchor="middle">&quot;I have this block in my inventory&quot;</text>

    <!-- Step 2: Node B checks local storage -->
    <rect x="420" y="130" width="230" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="535" y="150" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">2. Local Chain Lookup</text>
    <text x="535" y="168" fill="#cbd5e1" font-size="9" text-anchor="middle">Checks if block hash is already in chain.</text>
    <text x="535" y="176" fill="#a7f3d0" font-size="8" text-anchor="middle">Unknown hash &#8594; Requests block</text>

    <!-- Step 3: getdata Message (B -> A) -->
    <path d="M 475 210 L 110 210" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr5)"/>
    <rect x="180" y="185" width="220" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="290" y="203" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. &apos;getdata&apos; [MSG_BLOCK]</text>
    <text x="290" y="218" fill="#94a3b8" font-size="9" text-anchor="middle">Type: MSG_BLOCK, Hash: 0000... </text>
    <text x="290" y="228" fill="#cbd5e1" font-size="8" text-anchor="middle">&quot;Please transmit full block payload&quot;</text>

    <!-- Step 4: block Message (A -> B) -->
    <path d="M 110 270 L 475 270" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arr5-green)"/>
    <rect x="160" y="245" width="260" height="52" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="290" y="265" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">4. &apos;block&apos; message (Full Payload)</text>
    <text x="290" y="280" fill="#94a3b8" font-size="9" text-anchor="middle">Header (80B) + Tx Count + All Serialized Txs</text>
    <text x="290" y="291" fill="#cbd5e1" font-size="8" text-anchor="middle">(Up to ~1-4 MB data transmission)</text>

    <!-- Step 5: Full Consensus Verification -->
    <rect x="375" y="325" width="200" height="120" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="475" y="345" fill="#c4b5fd" font-size="11" font-weight="bold" text-anchor="middle">5. Node B Consensus Check</text>
    <text x="385" y="365" fill="#cbd5e1" font-size="9">&#8226; PoW: Hash &lt; Target (Difficulty)</text>
    <text x="385" y="380" fill="#cbd5e1" font-size="9">&#8226; Header timestamp within 2 hrs</text>
    <text x="385" y="395" fill="#cbd5e1" font-size="9">&#8226; Merkle root matches transactions</text>
    <text x="385" y="410" fill="#cbd5e1" font-size="9">&#8226; Validates all scriptSig / scriptPubKey</text>
    <text x="385" y="425" fill="#cbd5e1" font-size="9">&#8226; No double spending &amp; correct subsidy</text>
    <text x="475" y="438" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle">&#10003; BLOCK ACCEPTED TO CHAIN</text>

    <!-- Step 6: Relay inv to Node C (Gossip) -->
    <path d="M 475 470 L 840 470" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr5-orange)"/>
    <rect x="545" y="445" width="220" height="48" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="655" y="463" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">6. &apos;inv&apos; [MSG_BLOCK]</text>
    <text x="655" y="478" fill="#94a3b8" font-size="9" text-anchor="middle">Hash: 00000000000000... (32B hash)</text>
    <text x="655" y="488" fill="#cbd5e1" font-size="8" text-anchor="middle">&quot;Relaying new block to neighbor peers&quot;</text>

    <!-- Step 7: Node C getdata -->
    <path d="M 840 530 L 475 530" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr5)"/>
    <rect x="545" y="505" width="220" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="655" y="523" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">7. &apos;getdata&apos; [MSG_BLOCK]</text>
    <text x="655" y="538" fill="#94a3b8" font-size="9" text-anchor="middle">Node C requests block from Node B</text>

    <!-- Step 8: Node B serves block -->
    <path d="M 475 580 L 840 580" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr5-green)"/>
    <rect x="545" y="558" width="220" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="655" y="575" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">8. &apos;block&apos; (Full Payload)</text>
    <text x="655" y="590" fill="#94a3b8" font-size="9" text-anchor="middle">Block propagates across entire network</text>
  </g>

</svg>