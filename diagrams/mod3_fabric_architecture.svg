<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" width="100%" height="100%" style="background:#0c1322; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="org1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ordererGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowViolet3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1100" height="65" rx="10" fill="url(#headerGrad3)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow3)" />
  <text x="590" y="55" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Hyperledger Fabric Enterprise Architecture</text>
  <text x="590" y="76" fill="#bae6fd" font-size="13" text-anchor="middle">Multi-Channel Partitioning, Peer Roles (Endorser/Committer/Anchor), Raft Ordering &amp; StateDB (CouchDB)</text>

  <!-- CHANNEL OVERLAY BANNER: Channel 1 (Shared) vs Channel 2 (Private) -->
  <rect x="40" y="105" width="1100" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6,4" />
  <rect x="55" y="112" width="530" height="28" rx="5" fill="#0369a1" />
  <text x="320" y="131" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Channel 1: "mychannel" (Shared by Org 1 &amp; Org 2 — Ledger 1)</text>

  <rect x="605" y="112" width="520" height="28" rx="5" fill="#581c87" />
  <text x="865" y="131" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Channel 2: "privatechannel" (Isolated to Org 1 only — Ledger 2)</text>

  <!-- ORGANIZATION 1 CONTAINER -->
  <rect x="40" y="160" width="535" height="440" rx="10" fill="url(#org1Grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow3)" />
  <rect x="55" y="172" width="505" height="32" rx="6" fill="#0284c7" />
  <text x="307" y="193" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">Organization 1 (Org1MSP)</text>

  <!-- Org 1 Client App & CA -->
  <rect x="55" y="215" width="155" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="132" y="235" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">Client App / SDK</text>
  <text x="132" y="253" fill="#cbd5e1" font-size="10" text-anchor="middle">Fabric Node / Go SDK</text>
  <text x="132" y="271" fill="#94a3b8" font-size="9.5" text-anchor="middle">• Proposes Tx (Proposal)</text>
  <text x="132" y="287" fill="#94a3b8" font-size="9.5" text-anchor="middle">• Collects Endorsements</text>
  <text x="132" y="303" fill="#94a3b8" font-size="9.5" text-anchor="middle">• Broadcasts to Orderer</text>

  <rect x="55" y="335" width="155" height="75" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="132" y="355" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">Fabric CA 1</text>
  <text x="132" y="373" fill="#cbd5e1" font-size="9.5" text-anchor="middle">ca.org1.example.com</text>
  <text x="132" y="391" fill="#94a3b8" font-size="9.5" text-anchor="middle">X.509 MSP Certs</text>

  <!-- Peer 0 Org 1 (Endorsing & Anchor Peer) -->
  <rect x="220" y="215" width="340" height="180" rx="8" fill="#032b43" stroke="#38bdf8" stroke-width="1.2" />
  <rect x="230" y="223" width="320" height="24" rx="4" fill="#0369a1" />
  <text x="390" y="239" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">peer0.org1.example.com (Endorser &amp; Anchor Peer)</text>

  <rect x="230" y="253" width="150" height="85" rx="6" fill="#021c2d" stroke="#34d399" stroke-width="1" />
  <text x="305" y="270" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Chaincode Container</text>
  <text x="305" y="286" fill="#cbd5e1" font-size="9" text-anchor="middle">Isolated Docker execution</text>
  <text x="305" y="302" fill="#cbd5e1" font-size="9" text-anchor="middle">Simulates Tx on World State</text>
  <text x="305" y="318" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Produces RWSet + Sig</text>

  <rect x="390" y="253" width="160" height="85" rx="6" fill="#021c2d" stroke="#38bdf8" stroke-width="1" />
  <text x="470" y="270" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">Peer Subsystems</text>
  <text x="470" y="286" fill="#cbd5e1" font-size="9" text-anchor="middle">• Gossip Protocol (Discov.)</text>
  <text x="470" y="302" fill="#cbd5e1" font-size="9" text-anchor="middle">• Anchor Bridge to Org 2</text>
  <text x="470" y="318" fill="#cbd5e1" font-size="9" text-anchor="middle">• Validation &amp; MVCC check</text>

  <!-- Ledger & StateDB (Peer 0) -->
  <rect x="230" y="345" width="150" height="42" rx="5" fill="#1e3a5f" />
  <text x="305" y="362" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">StateDB: CouchDB 0</text>
  <text x="305" y="376" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Port 5984 (Rich JSON Queries)</text>

  <rect x="390" y="345" width="160" height="42" rx="5" fill="#1e3a5f" />
  <text x="470" y="362" fill="#bae6fd" font-size="10" font-weight="700" text-anchor="middle">Blockchain (File Log)</text>
  <text x="470" y="376" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Block 0 (Genesis) .. Block N</text>

  <!-- Peer 1 Org 1 (Committing Peer) -->
  <rect x="55" y="420" width="505" height="70" rx="8" fill="#032b43" stroke="#94a3b8" stroke-width="1" />
  <text x="180" y="442" fill="#cbd5e1" font-size="11" font-weight="700">peer1.org1.example.com (Committing Peer)</text>
  <text x="180" y="458" fill="#94a3b8" font-size="9.5">• No chaincode execution container • Validates block signatures &amp; MVCC</text>
  <text x="180" y="473" fill="#94a3b8" font-size="9.5">• Maintains replicated copy of Channel 1 &amp; Channel 2 ledgers</text>
  <rect x="420" y="430" width="125" height="48" rx="5" fill="#1e3a5f" />
  <text x="482" y="450" fill="#fde68a" font-size="9.5" font-weight="700" text-anchor="middle">StateDB (LevelDB)</text>
  <text x="482" y="465" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Fast Key-Value Store</text>

  <!-- Org 1 Multi-Channel Status -->
  <rect x="55" y="500" width="505" height="85" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
  <text x="307" y="520" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">Org 1 Channel Membership</text>
  <text x="70" y="540" fill="#cbd5e1" font-size="9.5">• Joined to <tspan fill="#38bdf8" font-weight="700">Channel 1 (mychannel)</tspan>: Shares asset data with Org 2 via Endorsement Policy.</text>
  <text x="70" y="558" fill="#cbd5e1" font-size="9.5">• Joined to <tspan fill="#e879f9" font-weight="700">Channel 2 (privatechannel)</tspan>: Maintains private bilateral ledger hidden from Org 2.</text>
  <text x="70" y="574" fill="#94a3b8" font-size="9">Chaincode deployed: `basic_1.0` (mychannel), `private_audit_1.0` (privatechannel).</text>

  <!-- ORGANIZATION 2 CONTAINER -->
  <rect x="605" y="160" width="535" height="440" rx="10" fill="url(#org1Grad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow3)" />
  <rect x="620" y="172" width="505" height="32" rx="6" fill="#059669" />
  <text x="872" y="193" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">Organization 2 (Org2MSP)</text>

  <!-- Org 2 Client App & CA -->
  <rect x="620" y="215" width="155" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="697" y="235" fill="#34d399" font-size="11.5" font-weight="700" text-anchor="middle">Client App / SDK</text>
  <text x="697" y="253" fill="#cbd5e1" font-size="10" text-anchor="middle">Fabric Node / Go SDK</text>
  <text x="697" y="271" fill="#94a3b8" font-size="9.5" text-anchor="middle">• Proposes Tx to Org 2</text>
  <text x="697" y="287" fill="#94a3b8" font-size="9.5" text-anchor="middle">• Cross-endorses proposals</text>
  <text x="697" y="303" fill="#94a3b8" font-size="9.5" text-anchor="middle">• Submits to Orderer</text>

  <rect x="620" y="335" width="155" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="697" y="355" fill="#34d399" font-size="11.5" font-weight="700" text-anchor="middle">Fabric CA 2</text>
  <text x="697" y="373" fill="#cbd5e1" font-size="9.5" text-anchor="middle">ca.org2.example.com</text>
  <text x="697" y="391" fill="#94a3b8" font-size="9.5" text-anchor="middle">X.509 MSP Certs</text>

  <!-- Peer 0 Org 2 (Endorsing & Anchor Peer) -->
  <rect x="785" y="215" width="340" height="180" rx="8" fill="#033020" stroke="#10b981" stroke-width="1.2" />
  <rect x="795" y="223" width="320" height="24" rx="4" fill="#047857" />
  <text x="955" y="239" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">peer0.org2.example.com (Endorser &amp; Anchor Peer)</text>

  <rect x="795" y="253" width="150" height="85" rx="6" fill="#021f14" stroke="#34d399" stroke-width="1" />
  <text x="870" y="270" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Chaincode Container</text>
  <text x="870" y="286" fill="#cbd5e1" font-size="9" text-anchor="middle">Dev-peer0.org2-basic</text>
  <text x="870" y="302" fill="#cbd5e1" font-size="9" text-anchor="middle">Identical business logic</text>
  <text x="870" y="318" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Endorsement signature</text>

  <rect x="955" y="253" width="160" height="85" rx="6" fill="#021f14" stroke="#10b981" stroke-width="1" />
  <text x="1035" y="270" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">Peer Subsystems</text>
  <text x="1035" y="286" fill="#cbd5e1" font-size="9" text-anchor="middle">• Gossip Protocol Relay</text>
  <text x="1035" y="302" fill="#cbd5e1" font-size="9" text-anchor="middle">• Anchor Bridge to Org 1</text>
  <text x="1035" y="318" fill="#cbd5e1" font-size="9" text-anchor="middle">• Multi-version check</text>

  <!-- Ledger & StateDB (Peer 0 Org 2) -->
  <rect x="795" y="345" width="150" height="42" rx="5" fill="#1b4d3e" />
  <text x="870" y="362" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">StateDB: CouchDB 1</text>
  <text x="870" y="376" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Port 7984 (JSON index)</text>

  <rect x="955" y="345" width="160" height="42" rx="5" fill="#1b4d3e" />
  <text x="1035" y="362" fill="#bae6fd" font-size="10" font-weight="700" text-anchor="middle">Blockchain (File Log)</text>
  <text x="1035" y="376" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Block 0 (Genesis) .. Block N</text>

  <!-- Peer 1 Org 2 (Committing Peer) -->
  <rect x="620" y="420" width="505" height="70" rx="8" fill="#033020" stroke="#94a3b8" stroke-width="1" />
  <text x="745" y="442" fill="#cbd5e1" font-size="11" font-weight="700">peer1.org2.example.com (Committing Peer)</text>
  <text x="745" y="458" fill="#94a3b8" font-size="9.5">• Commits blocks, validates policy matching • No chaincode execution container</text>
  <text x="745" y="473" fill="#94a3b8" font-size="9.5">• Zero access to Channel 2 (Channel isolation enforced cryptographically)</text>
  <rect x="985" y="430" width="125" height="48" rx="5" fill="#1b4d3e" />
  <text x="1047" y="450" fill="#fde68a" font-size="9.5" font-weight="700" text-anchor="middle">StateDB (LevelDB)</text>
  <text x="1047" y="465" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Key-Value Store</text>

  <!-- Org 2 Multi-Channel Status -->
  <rect x="620" y="500" width="505" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="872" y="520" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Org 2 Channel Membership</text>
  <text x="635" y="540" fill="#cbd5e1" font-size="9.5">• Joined to <tspan fill="#38bdf8" font-weight="700">Channel 1 (mychannel)</tspan>: Syncs ledger transactions with Org 1.</text>
  <text x="635" y="558" fill="#f43f5e" font-size="9.5">• <tspan font-weight="700">NOT JOINED to Channel 2</tspan>: Denied by Orderer MSP &amp; channel genesis block.</text>
  <text x="635" y="574" fill="#94a3b8" font-size="9">Confidentiality Guarantee: No block headers, payload, or StateDB entries exist in Org 2.</text>

  <!-- ORDERING SERVICE CLUSTER -->
  <rect x="40" y="620" width="1100" height="175" rx="10" fill="url(#ordererGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow3)" />
  <rect x="55" y="632" width="1070" height="30" rx="6" fill="#4338ca" />
  <text x="590" y="652" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Ordering Service (EtcdRaft Consensus Cluster — OrdererMSP)</text>

  <!-- Orderer Nodes -->
  <rect x="55" y="675" width="230" height="105" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1" />
  <text x="170" y="698" fill="#a78bfa" font-size="11.5" font-weight="700" text-anchor="middle">orderer.example.com</text>
  <text x="170" y="718" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Raft Leader Node (Port 7050)</text>
  <text x="170" y="736" fill="#94a3b8" font-size="9" text-anchor="middle">• Receives endorsed tx batches</text>
  <text x="170" y="752" fill="#94a3b8" font-size="9" text-anchor="middle">• Deterministic sequence ordering</text>
  <text x="170" y="768" fill="#38bdf8" font-size="9" text-anchor="middle">• Packages transactions into blocks</text>

  <rect x="300" y="675" width="220" height="105" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1" />
  <text x="410" y="698" fill="#a78bfa" font-size="11.5" font-weight="700" text-anchor="middle">orderer2 / orderer3</text>
  <text x="410" y="718" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Raft Follower Nodes</text>
  <text x="410" y="736" fill="#94a3b8" font-size="9" text-anchor="middle">• Raft log replication (CFT)</text>
  <text x="410" y="752" fill="#94a3b8" font-size="9" text-anchor="middle">• Tolerate F failures: 2F + 1</text>
  <text x="410" y="768" fill="#94a3b8" font-size="9" text-anchor="middle">• Automatic leader re-election</text>

  <rect x="535" y="675" width="270" height="105" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1" />
  <text x="670" y="698" fill="#fbbf24" font-size="11.5" font-weight="700" text-anchor="middle">Channel Configuration (configtx)</text>
  <text x="670" y="718" fill="#cbd5e1" font-size="9.5" text-anchor="middle">• Genesis block creation</text>
  <text x="670" y="736" fill="#cbd5e1" font-size="9.5" text-anchor="middle">• Channel policies (Readers/Writers/Admins)</text>
  <text x="670" y="752" fill="#cbd5e1" font-size="9.5" text-anchor="middle">• BatchSize: MaxMessageCount / PreferredBytes</text>
  <text x="670" y="768" fill="#cbd5e1" font-size="9.5" text-anchor="middle">• BatchTimeout: e.g., 2 seconds</text>

  <rect x="820" y="675" width="305" height="105" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1" />
  <text x="972" y="698" fill="#34d399" font-size="11.5" font-weight="700" text-anchor="middle">Block Delivery to Peers</text>
  <text x="835" y="718" fill="#cbd5e1" font-size="9.5">• Delivers sealed blocks via gRPC stream</text>
  <text x="835" y="736" fill="#cbd5e1" font-size="9.5">• Delivered to Org Leader Peers / Anchor Peers</text>
  <text x="835" y="752" fill="#cbd5e1" font-size="9.5">• Gossip protocol disseminates block across peer mesh</text>
  <text x="835" y="768" fill="#fbbf24" font-size="9.5" font-weight="700">• Orderer does NOT execute chaincode or validate tx logic</text>
</svg>