    <path d="M 140 180 L 190 230 L 220 230" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6 3"/>

    <!-- Upper Branch: Honest Public Chain -->
    <g transform="translate(220, 65)">
      <!-- Block N -->
      <rect x="0" y="0" width="115" height="70" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
      <text x="57" y="22" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Block N (Honest)</text>
      <text x="57" y="38" fill="#CBD5E1" font-family="monospace" font-size="9" text-anchor="middle">Tx: Attacker &#8594; Merch</text>
      <text x="57" y="52" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">100 BTC Paid</text>

      <line x1="115" y1="35" x2="145" y2="35" stroke="#3B82F6" stroke-width="2"/>

      <!-- Block N+1 -->
      <rect x="145" y="0" width="115" height="70" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
      <text x="202" y="22" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Block N+1</text>
      <text x="202" y="38" fill="#CBD5E1" font-family="monospace" font-size="9" text-anchor="middle">Confirm 1</text>

