      <text x="347" y="22" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Block N+2</text>
      <text x="347" y="38" fill="#CBD5E1" font-family="monospace" font-size="9" text-anchor="middle">Confirm 2</text>
      <text x="347" y="52" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">&#10003; Goods Shipped!</text>
