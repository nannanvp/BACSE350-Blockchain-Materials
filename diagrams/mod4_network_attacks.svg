      <text x="360" y="84" fill="#A7F3D0" font-family="monospace" font-size="8" text-anchor="middle">Peer B</text>
      <line x1="342" y1="88" x2="264" y2="126" stroke="#10B981" stroke-width="1.5"/>

      <!-- Peer 3 (Asia) -->
      <circle cx="120" cy="200" r="18" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="120" y="204" fill="#A7F3D0" font-family="monospace" font-size="8" text-anchor="middle">Peer C</text>
      <line x1="138" y1="192" x2="216" y2="154" stroke="#10B981" stroke-width="1.5"/>

      <!-- Peer 4 (SA) -->
      <circle cx="360" cy="200" r="18" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="360" y="204" fill="#A7F3D0" font-family="monospace" font-size="8" text-anchor="middle">Peer D</text>
      <line x1="342" y1="192" x2="264" y2="154" stroke="#10B981" stroke-width="1.5"/>

      <text x="240" y="255" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">&#10003; Diverse independent peers from different ASNs &amp; IP ranges</text>
    </g>

    <!-- Eclipsed Topology (Right) -->
