    <text x="24" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. The 51% Attack &amp; Deep Chain Reorganization (Double-Spending Mechanism)</text>

    <!-- Fork Point Block -->
    <g transform="translate(40, 130)">
