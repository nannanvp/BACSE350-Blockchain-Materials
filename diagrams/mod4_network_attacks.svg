      <rect x="0" y="0" width="510" height="280" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="255" y="25" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Eclipsed Node (Adversary Controlled Sockets)</text>

      <!-- Central Victim Node -->
      <circle cx="255" cy="140" r="28" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
      <text x="255" y="137" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">VICTIM</text>
      <text x="255" y="149" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">NODE</text>

      <!-- Surrounding Attacker Sybils -->
      <!-- Sybil 1 -->
      <circle cx="130" cy="80" r="18" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="130" y="84" fill="#FCA5A5" font-family="monospace" font-size="8" text-anchor="middle">Sybil 1</text>
      <line x1="148" y1="88" x2="231" y2="126" stroke="#EF4444" stroke-width="2"/>

      <!-- Sybil 2 -->
      <circle cx="380" cy="80" r="18" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="380" y="84" fill="#FCA5A5" font-family="monospace" font-size="8" text-anchor="middle">Sybil 2</text>
      <line x1="362" y1="88" x2="279" y2="126" stroke="#EF4444" stroke-width="2"/>

      <!-- Sybil 3 -->
      <circle cx="130" cy="200" r="18" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="130" y="204" fill="#FCA5A5" font-family="monospace" font-size="8" text-anchor="middle">Sybil 3</text>
      <line x1="148" y1="192" x2="231" y2="154" stroke="#EF4444" stroke-width="2"/>

      <!-- Sybil 4 -->
      <circle cx="380" cy="200" r="18" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="380" y="204" fill="#FCA5A5" font-family="monospace" font-size="8" text-anchor="middle">Sybil 4</text>
      <line x1="362" y1="192" x2="279" y2="154" stroke="#EF4444" stroke-width="2"/>

      <!-- Threat Details -->
      <text x="255" y="248" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">&#10007; Attacker saturates trie / peer table with spoofed IP addresses.</text>
      <text x="255" y="264" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Victim receives fake view of blockchain, enabling 0-conf double spend &amp; selfish mining.</text>
    </g>
