    <g transform="translate(220, 195)">
      <!-- Block N (Secret) -->
      <rect x="0" y="0" width="115" height="70" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="2"/>
      <text x="57" y="22" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Block N (Secret)</text>
