      <text x="50" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Block N-1</text>
      <text x="50" y="48" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Common Root</text>
    </g>

    <!-- Branch Arrows -->
