    <text x="540" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">BLOCKCHAIN NETWORK ATTACKS: 51% EXPLOIT &amp; ECLIPSE TOPOLOGY</text>
    <text x="540" y="52" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Consensus Reorganization via Majority Hashpower vs. P2P Routing Table Poisoning</text>
  </g>

  <!-- Section 1: 51% Attack / Reorganization (Top Half) -->
