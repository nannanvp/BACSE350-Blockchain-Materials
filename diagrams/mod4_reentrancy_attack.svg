<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="attGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="vicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60A5FA"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1200" height="860" rx="16" fill="url(#bgGrad2)"/>
  <rect x="2" y="2" width="1196" height="856" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="1080" height="70" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="540" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">THE DAO HACK: REENTRANCY ATTACK SEQUENCE</text>
    <text x="540" y="52" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Execution Flow of Recursive External Calls Draining Balances Before Internal State Updates</text>
  </g>

  <!-- Lifeline Headers -->
  <!-- 1. Attacker EOA -->
  <g transform="translate(100, 125)" filter="url(#shadow2)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    <text x="110" y="24" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ATTACKER EOA</text>
    <text x="110" y="40" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Externally Owned Account</text>
  </g>

  <!-- 2. Malicious Contract -->
  <g transform="translate(480, 125)" filter="url(#shadow2)">
    <rect x="0" y="0" width="240" height="50" rx="8" fill="url(#attGrad)" stroke="#F87171" stroke-width="2"/>
    <text x="120" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ATTACKER CONTRACT</text>
    <text x="120" y="40" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Exploit Contract with fallback()</text>
  </g>

  <!-- 3. Target DAO Contract -->
  <g transform="translate(860, 125)" filter="url(#shadow2)">
    <rect x="0" y="0" width="240" height="50" rx="8" fill="url(#vicGrad)" stroke="#60A5FA" stroke-width="2"/>
    <text x="120" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">VULNERABLE DAO CONTRACT</text>
    <text x="120" y="40" fill="#DBEAFE" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Victim Vault (SimpleDAO.sol)</text>
  </g>

  <!-- Lifeline Dashed Tracks -->
  <line x1="210" y1="175" x2="210" y2="670" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="600" y1="175" x2="600" y2="670" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="980" y1="175" x2="980" y2="670" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Step 1: Deposit -->
  <line x1="210" y1="210" x2="590" y2="210" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="350" y="202" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">1. Trigger Exploit</text>

  <line x1="600" y1="230" x2="970" y2="230" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="790" y="222" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">2. deposit{value: 1 ETH}()</text>
  
  <!-- State Box: Initial Deposit -->
  <g transform="translate(1010, 215)">
    <rect x="0" y="0" width="160" height="36" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="80" y="16" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">balances[Attacker]=1</text>
    <text x="80" y="29" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Vault Total = 100 ETH</text>
  </g>

  <!-- Step 2: First Withdraw Call -->
  <line x1="600" y1="280" x2="970" y2="280" stroke="#EF4444" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="790" y="272" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">3. withdraw(1 ETH)</text>

  <!-- Victim Checks -->
  <g transform="translate(880, 300)">
    <rect x="0" y="0" width="200" height="26" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="100" y="17" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">&#10003; require(balance &gt;= 1)</text>
  </g>

  <!-- Step 3: Vulnerable External Transfer BEFORE State Update -->
  <line x1="980" y1="350" x2="610" y2="350" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="790" y="342" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4. msg.sender.call{value: 1 ETH}("") [TRANSFER FIRST!]</text>

  <!-- Callout on State Not Updated -->
  <g transform="translate(1010, 335)">
    <rect x="0" y="0" width="165" height="40" rx="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
    <text x="82" y="16" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FATAL FLAW:</text>
    <text x="82" y="30" fill="#FCA5A5" font-family="monospace" font-size="9" text-anchor="middle">balance NOT decremented!</text>
  </g>

  <!-- Step 4: Fallback Intercepts and Calls Withdraw AGAIN -->
  <path d="M 600 365 Q 520 385 600 415" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="500" y="395" fill="#FCA5A5" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">fallback() triggers</text>

  <line x1="600" y1="425" x2="970" y2="425" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#arrRed)"/>
  <text x="790" y="418" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">5. RE-ENTER: withdraw(1 ETH) [RECURSIVE CALL 1]</text>

  <!-- Victim Checks AGAIN -->
  <g transform="translate(880, 440)">
    <rect x="0" y="0" width="200" height="26" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="100" y="17" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">&#10003; require(balance &gt;= 1) PASSES!</text>
  </g>

  <!-- Step 5: Transfer Again -->
  <line x1="980" y1="485" x2="610" y2="485" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="790" y="478" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">6. Transfer another 1 ETH to Attacker</text>

  <!-- Step 6: Fallback Intercepts Again -->
  <path d="M 600 495 Q 520 515 600 545" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="500" y="525" fill="#FCA5A5" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">fallback() triggers</text>

  <line x1="600" y1="555" x2="970" y2="555" stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#arrRed)"/>
  <text x="790" y="548" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">7. RE-ENTER: withdraw(1 ETH) [RECURSIVE CALL 2..N]</text>

  <!-- Recursion Bracket / Drain Loop Box -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="240" height="150" rx="10" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
    <text x="120" y="24" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">&#8635; RECURSIVE DRAIN LOOP</text>
    <text x="12" y="48" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11">&#8226; Repeats until gas runs out</text>
    <text x="12" y="68" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11">&#8226; Or target contract balance = 0</text>
    <text x="12" y="90" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">ATM Analogy: You ask for ₹500.</text>
    <text x="12" y="106" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">ATM dispenses cash before updating</text>
    <text x="12" y="122" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">your passbook. You press withdraw</text>
    <text x="12" y="138" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">repeatedly in the middle!</text>
  </g>

  <!-- Step 7: Call Stack Unwinds -->
  <line x1="980" y1="615" x2="980" y2="645" stroke="#94A3B8" stroke-width="2"/>
  <g transform="translate(860, 615)">
    <rect x="0" y="0" width="240" height="40" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="120" y="18" fill="#CBD5E1" font-family="monospace" font-size="10" text-anchor="middle">8. balances[msg.sender] = 0;</text>
    <text x="120" y="32" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">TOO LATE! Vault is already 0 ETH.</text>
  </g>

  <!-- Bottom Panel: The Remediation (CEI & ReentrancyGuard) -->
  <g transform="translate(60, 690)" filter="url(#shadow2)">
    <rect x="0" y="0" width="1080" height="145" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="1080" height="32" rx="12" fill="url(#safeGrad)"/>
    <text x="540" y="21" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">&#10003; PERMANENT REMEDIATION PATTERNS</text>

    <!-- Sub-panel 1: Checks-Effects-Interactions -->
    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="480" height="85" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">1. Checks-Effects-Interactions (CEI) Pattern</text>
      <text x="15" y="38" fill="#CBD5E1" font-family="monospace" font-size="11">1. require(balances[msg.sender] &gt;= amount); // 1. CHECK</text>
      <text x="15" y="54" fill="#38BDF8" font-family="monospace" font-size="11">2. balances[msg.sender] -= amount;         // 2. EFFECT (STATE FIRST!)</text>
      <text x="15" y="70" fill="#A7F3D0" font-family="monospace" font-size="11">3. (bool ok, ) = msg.sender.call{value: amount}(""); // 3. INTERACT</text>
    </g>

    <!-- Sub-panel 2: Mutex Lock ReentrancyGuard -->
    <g transform="translate(560, 45)">
      <rect x="0" y="0" width="490" height="85" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">2. Mutex Lock (OpenZeppelin ReentrancyGuard)</text>
      <text x="15" y="38" fill="#CBD5E1" font-family="monospace" font-size="11">modifier nonReentrant() {</text>
      <text x="15" y="54" fill="#FDE68A" font-family="monospace" font-size="11">  require(_status != _ENTERED, "ReentrancyGuard: reentrant call");</text>
      <text x="15" y="70" fill="#94A3B8" font-family="monospace" font-size="11">  _status = _ENTERED; _; _status = _NOT_ENTERED; }</text>
    </g>
  </g>
</svg>