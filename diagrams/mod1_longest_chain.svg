<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="validBlockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="orphanBlockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <marker id="arrowMain" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#4ade80"/>
    </marker>
    <marker id="arrowDrop" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f87171"/>
    </marker>
    <marker id="arrowPool" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1180" height="720" fill="url(#bgGrad6)"/>

  <!-- Title -->
  <text x="590" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" letter-spacing="1">FORK RESOLUTION &amp; THE LONGEST CHAIN RULE</text>
  <text x="590" y="62" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Nakamoto Consensus: How distributed nodes resolve temporary simultaneous block race conditions and maintain single state</text>

  <!-- STEP 1: Common Trunk -->
  <g transform="translate(40, 240)">
    <!-- Block 1 -->
    <rect x="0" y="0" width="130" height="120" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="28" rx="10" fill="#334155"/>
    <text x="65" y="19" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">BLOCK 101</text>
    <text x="15" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9">PrevHash: ...a12</text>
    <text x="15" y="68" fill="#38bdf8" font-family="sans-serif" font-size="9">Merkle: ...8b2</text>
    <text x="15" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="9">Nonce: 481902</text>
    <rect x="10" y="96" width="110" height="18" rx="4" fill="#0f172a"/>
    <text x="65" y="108" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="8">Hash: 000...e10</text>

    <!-- Arrow to Block 102 -->
    <line x1="130" y1="60" x2="175" y2="60" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowMain)"/>

    <!-- Block 2 -->
    <rect x="180" y="0" width="130" height="120" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="28" rx="10" transform="translate(180, 0)" fill="#334155"/>
    <text x="245" y="19" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">BLOCK 102</text>
    <text x="195" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9">PrevHash: ...e10</text>
    <text x="195" y="68" fill="#38bdf8" font-family="sans-serif" font-size="9">Merkle: ...c91</text>
    <text x="195" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="9">Nonce: 729103</text>
    <rect x="190" y="96" width="110" height="18" rx="4" fill="#0f172a"/>
    <text x="245" y="108" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="8">Hash: 000...42f</text>
  </g>

  <!-- STEP 2: The Fork Divergence -->
  <!-- Upper Fork Path -->
  <path d="M 350 300 C 380 300, 390 190, 430 190" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowMain)"/>
  <text x="360" y="225" fill="#4ade80" font-family="sans-serif" font-size="9" font-weight="bold">Miner A (Europe)</text>

  <!-- Lower Fork Path -->
  <path d="M 350 300 C 380 300, 390 410, 430 410" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrowDrop)"/>
  <text x="360" y="380" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="bold">Miner B (Asia)</text>

  <!-- UPPER BRANCH: Winning Longest Chain (Cumulative Difficulty = 104) -->
  <g transform="translate(435, 130)">
    <!-- Block 103A -->
    <rect x="0" y="0" width="135" height="120" rx="10" fill="#064e3b" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="135" height="28" rx="10" fill="#15803d"/>
    <text x="67" y="19" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">BLOCK 103-A</text>
    <text x="12" y="48" fill="#a7f3d0" font-family="sans-serif" font-size="9">PrevHash: ...42f</text>
    <text x="12" y="68" fill="#bbf7d0" font-family="sans-serif" font-size="9">Timestamp: 14:00:02</text>
    <text x="12" y="88" fill="#dcfce7" font-family="sans-serif" font-size="9">Txs: 2,150 tx</text>
    <rect x="10" y="96" width="115" height="18" rx="4" fill="#022c22"/>
    <text x="67" y="108" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="8">Hash: 000...99a</text>

    <!-- Arrow to 104A -->
    <line x1="135" y1="60" x2="180" y2="60" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowMain)"/>

    <!-- Block 104A -->
    <rect x="185" y="0" width="135" height="120" rx="10" fill="#064e3b" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="135" height="28" rx="10" transform="translate(185, 0)" fill="#15803d"/>
    <text x="252" y="19" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">BLOCK 104-A</text>
    <text x="197" y="48" fill="#a7f3d0" font-family="sans-serif" font-size="9">PrevHash: ...99a</text>
    <text x="197" y="68" fill="#bbf7d0" font-family="sans-serif" font-size="9">Timestamp: 14:09:45</text>
    <text x="197" y="88" fill="#dcfce7" font-family="sans-serif" font-size="9">Txs: 1,980 tx</text>
    <rect x="195" y="96" width="115" height="18" rx="4" fill="#022c22"/>
    <text x="252" y="108" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="8">Hash: 000...3bc</text>

    <!-- Arrow to 105A -->
    <line x1="320" y1="60" x2="365" y2="60" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowMain)"/>

    <!-- Block 105A -->
    <rect x="370" y="0" width="135" height="120" rx="10" fill="#064e3b" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="135" height="28" rx="10" transform="translate(370, 0)" fill="#15803d"/>
    <text x="437" y="19" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">BLOCK 105-A</text>
    <text x="382" y="48" fill="#a7f3d0" font-family="sans-serif" font-size="9">PrevHash: ...3bc</text>
    <text x="382" y="68" fill="#bbf7d0" font-family="sans-serif" font-size="9">Timestamp: 14:20:10</text>
    <text x="382" y="88" fill="#dcfce7" font-family="sans-serif" font-size="9">Txs: 2,420 tx</text>
    <rect x="380" y="96" width="115" height="18" rx="4" fill="#022c22"/>
    <text x="437" y="108" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="8">Hash: 000...f71</text>

    <!-- Longest Chain Badge -->
    <rect x="525" y="35" width="170" height="50" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
    <text x="610" y="55" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">&#10004; CANONICAL CHAIN</text>
    <text x="610" y="73" text-anchor="middle" fill="#86efac" font-family="sans-serif" font-size="9">Most Accumulated Work</text>
  </g>

  <!-- LOWER BRANCH: Discarded Shorter Fork (Orphan / Stale Block) -->
  <g transform="translate(435, 350)">
    <!-- Block 103B -->
    <rect x="0" y="0" width="135" height="120" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4,3"/>
    <rect x="0" y="0" width="135" height="28" rx="10" fill="#991b1b"/>
    <text x="67" y="19" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">BLOCK 103-B</text>
    <text x="12" y="48" fill="#fca5a5" font-family="sans-serif" font-size="9">PrevHash: ...42f</text>
    <text x="12" y="68" fill="#fecaca" font-family="sans-serif" font-size="9">Timestamp: 14:00:03</text>
    <text x="12" y="88" fill="#fee2e2" font-family="sans-serif" font-size="9">Txs: 2,100 tx</text>
    <rect x="10" y="96" width="115" height="18" rx="4" fill="#200505"/>
    <text x="67" y="108" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="8">Hash: 000...55d</text>

    <!-- Orphan Block Badge -->
    <rect x="155" y="35" width="180" height="50" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="245" y="55" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">&#10008; ORPHAN / STALE BLOCK</text>
    <text x="245" y="73" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="9">Chain reorganization drops 103-B</text>

    <!-- Return to Mempool Flow -->
    <path d="M 67 125 C 67 170, 200 170, 360 170" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPool)"/>
  </g>

  <!-- MEMPOOL -->
  <g transform="translate(800, 480)">
    <rect width="340" height="85" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="170" y="24" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="11" font-weight="bold">&#128229; NODE MEMPOOL (Memory Pool)</text>
    <text x="15" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="9">Transactions inside the discarded Block 103-B that are NOT</text>
    <text x="15" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="9">in the winning 103-A / 104-A chain are safely returned to</text>
    <text x="15" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="9">the mempool to be included in subsequent blocks!</text>
  </g>

  <!-- BOTTOM EXAM TAKEAWAYS -->
  <g transform="translate(40, 580)">
    <rect width="1100" height="125" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="25" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">FORK RESOLUTION RULES FOR EXAMS:</text>

    <text x="25" y="50" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan fill="#4ade80" font-weight="bold">1. Heaviest Chain Criterion:</tspan> Satoshi defined the "longest chain" as the valid chain possessing the most cumulative proof of work (sum of block difficulties), not merely block count.</text>
    <text x="25" y="72" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan fill="#f87171" font-weight="bold">2. Tie-Breaking Protocol:</tspan> When two valid blocks arrive simultaneously, nodes keep the first-seen block on their active chain and track the alternate branch. The next block extension breaks the tie automatically.</text>
    <text x="25" y="94" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan fill="#fbbf24" font-weight="bold">3. Reorganization &amp; 6-Confirmations:</tspan> Mining rewards in orphan blocks become void. Waiting 6 block confirmations (~60 min) guarantees double-spend attack probability drops below 0.1% against a 10% attacker.</text>
  </g>
</svg>