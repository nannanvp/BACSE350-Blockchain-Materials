<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="genGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="traitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <marker id="arrowGen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad4)"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" letter-spacing="1">CONSENSUS FOUNDATIONS: TWO GENERALS &amp; BYZANTINE FAULT TOLERANCE (BFT)</text>
  <text x="600" y="60" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Theoretical boundaries of distributed agreement: From unsolvable lossy channels to Lamport's 2/3 honest majority rule</text>

  <!-- PANEL A: The Two Generals Problem -->
  <g transform="translate(35, 80)">
    <rect width="530" height="470" rx="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <rect width="530" height="36" rx="14" fill="#334155"/>
    <text x="265" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">PANEL A: THE TWO GENERALS PROBLEM (Lossy Channel)</text>

    <!-- Visual Hills and Valley -->
    <!-- Hill 1 -->
    <path d="M 30 220 Q 90 140 150 220 Z" fill="#1e293b" stroke="#475569"/>
    <!-- Hill 2 -->
    <path d="M 380 220 Q 440 140 500 220 Z" fill="#1e293b" stroke="#475569"/>
    <!-- Enemy Valley -->
    <rect x="180" y="180" width="170" height="40" rx="6" fill="#450a0a" stroke="#ef4444"/>
    <text x="265" y="204" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">&#9876; Enemy Camp (Valley)</text>

    <!-- General 1 -->
    <circle cx="90" cy="140" r="24" fill="url(#genGrad)" stroke="#93c5fd" stroke-width="2"/>
    <text x="90" y="144" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Gen 1</text>
    <text x="90" y="175" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="9">(Leader)</text>

    <!-- General 2 -->
    <circle cx="440" cy="140" r="24" fill="url(#genGrad)" stroke="#93c5fd" stroke-width="2"/>
    <text x="440" y="144" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Gen 2</text>
    <text x="440" y="175" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="9">(Follower)</text>

    <!-- Messaging Arrows & Loss Dilemma -->
    <path d="M 120 125 C 240 70, 320 70, 410 125" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowGen)"/>
    <text x="265" y="90" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">M1: "Attack at 06:00 AM" (Messenger may be captured!)</text>

    <path d="M 410 155 C 320 210, 240 210, 120 155" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowGen)"/>
    <text x="265" y="245" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold">ACK: "Received attack order. Confirming..."</text>

    <path d="M 120 145 C 240 125, 320 125, 410 145" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="265" y="130" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="9">ACK-of-ACK required... Infinite regression loop!</text>

    <!-- Analytical Takeaways -->
    <rect x="20" y="265" width="490" height="185" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="32" y="288" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">Core Dilemma &amp; Impossibility Proof:</text>
    <text x="32" y="308" fill="#e2e8f0" font-family="sans-serif" font-size="10">&#8226; Unreliable Medium: The messenger must cross enemy lines; packets can be dropped.</text>
    <text x="32" y="326" fill="#e2e8f0" font-family="sans-serif" font-size="10">&#8226; Coordination Risk: If both attack together, they win. If only one attacks, he is crushed.</text>
    <text x="32" y="344" fill="#e2e8f0" font-family="sans-serif" font-size="10">&#8226; The Infinite ACK Loop: Neither general can ever be 100% sure the other will attack,</text>
    <text x="42" y="358" fill="#e2e8f0" font-family="sans-serif" font-size="10">because the final messenger delivering the confirmation could always be captured.</text>
    <text x="32" y="380" fill="#fde047" font-family="sans-serif" font-size="10" font-weight="bold">&#8658; Mathematical Impossibility (Ackermann, 1975):</text>
    <text x="42" y="396" fill="#fde047" font-family="sans-serif" font-size="10">Deterministic consensus is mathematically impossible over an asynchronous lossy channel.</text>
    <text x="32" y="420" fill="#94a3b8" font-family="sans-serif" font-size="10">Internet Analogy: TCP handshake (SYN-ACK) mitigates this pragmatically, not deterministically.</text>
  </g>

  <!-- PANEL B: Byzantine Generals Problem -->
  <g transform="translate(605, 80)">
    <rect width="560" height="470" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="560" height="36" rx="14" fill="#1d4ed8"/>
    <text x="280" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">PANEL B: BYZANTINE GENERALS (Malicious Traitors &amp; Lamport's Law)</text>

    <!-- Lamport Equation Box -->
    <rect x="20" y="48" width="520" height="45" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="280" y="66" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Lamport, Shostak, Pease (1982) Condition:  N &#8805; 3m + 1</text>
    <text x="280" y="82" text-anchor="middle" fill="#bfdbfe" font-family="sans-serif" font-size="10">To tolerate 'm' arbitrary/Byzantine traitors, network requires &gt; 2/3 honest participants (&gt; 66.7%)</text>

    <!-- Commander and Lieutenants Graph -->
    <!-- Commander Node -->
    <circle cx="280" cy="140" r="26" fill="url(#genGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="137" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">COMMANDER</text>
    <text x="280" y="150" text-anchor="middle" fill="#bae6fd" font-family="sans-serif" font-size="8">(Order: ATTACK)</text>

    <!-- Lieutenant 1 (Honest) -->
    <circle cx="100" cy="245" r="22" fill="url(#genGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="100" y="243" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">L1</text>
    <text x="100" y="255" text-anchor="middle" fill="#bae6fd" font-family="sans-serif" font-size="7">Honest</text>

    <!-- Lieutenant 2 (TRAITOR) -->
    <circle cx="280" cy="245" r="24" fill="url(#traitorGrad)" stroke="#fca5a5" stroke-width="2"/>
    <text x="280" y="243" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">L2 (TRAITOR)</text>
    <text x="280" y="255" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="7">Lies/Alters msg</text>

    <!-- Lieutenant 3 (Honest) -->
    <circle cx="460" cy="245" r="22" fill="url(#genGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="460" y="243" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">L3</text>
    <text x="460" y="255" text-anchor="middle" fill="#bae6fd" font-family="sans-serif" font-size="7">Honest</text>

    <!-- Command Transmission Arrows -->
    <line x1="260" y1="160" x2="115" y2="230" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowGen)"/>
    <line x1="280" y1="166" x2="280" y2="220" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowGen)"/>
    <line x1="300" y1="160" x2="445" y2="230" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowGen)"/>

    <!-- Cross-Communication (Peer Relaying) -->
    <path d="M 125 245 L 255 245" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 305 245 L 435 245" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="370" y="238" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="8">L2 lies: "Cmd said RETREAT"</text>

    <!-- L3 Majority Voting Evaluation -->
    <rect x="20" y="285" width="520" height="165" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="32" y="306" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Majority Voting Resolution at Lieutenant 3 (L3):</text>
    <text x="32" y="325" fill="#e2e8f0" font-family="sans-serif" font-size="10">&#8226; Vector of received orders at L3: [ From Cmd: "ATTACK", From L1: "ATTACK", From L2: "RETREAT" ]</text>
    <text x="32" y="343" fill="#4ade80" font-family="sans-serif" font-size="10">&#8226; Majority Calculation: count("ATTACK") = 2, count("RETREAT") = 1  ==&gt;  <tspan font-weight="bold">MAJORITY = ATTACK!</tspan></text>
    <text x="32" y="361" fill="#e2e8f0" font-family="sans-serif" font-size="10">&#8226; Conclusion: Consensus is successfully achieved despite 1 traitor because N=4 &gt; 3(1)+1 = 4.</text>
    
    <text x="32" y="388" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold">Slide Case Inferences (Dr. Sandhya P):</text>
    <text x="32" y="405" fill="#cbd5e1" font-family="sans-serif" font-size="9">Case 1: Message order logging isolates traitor. Case 2: 10-min time bounds prevent retro-alterations.</text>
    <text x="32" y="420" fill="#cbd5e1" font-family="sans-serif" font-size="9">Case 3: Computational Nonce (Proof-of-Work) bounds supercomputer attacks. Case 4: Traitor commander resolved by lieutenants' default vote.</text>
  </g>

  <!-- BOTTOM PANEL: How Blockchain Solves Byzantine Agreement -->
  <g transform="translate(35, 570)">
    <rect width="1130" height="165" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">NAKAMOTO'S BREAKTHROUGH: SOLVING THE BYZANTINE GENERALS PROBLEM AT SCALE</text>
    
    <text x="25" y="52" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan fill="#38bdf8" font-weight="bold">1. Cryptographic Signatures:</tspan> Eliminate identity spoofing and message modification. A traitor cannot modify the commander's message without invalidating the ECDSA signature.</text>
    <text x="25" y="75" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan fill="#fbbf24" font-weight="bold">2. Proof of Work (PoW) Rate Limiter:</tspan> Introduces a 10-minute computational delay to mine each block. Traitors cannot spam conflicting messages without controlling &gt; 50% of the entire network's compute power.</text>
    <text x="25" y="98" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan fill="#4ade80" font-weight="bold">3. Longest Chain Rule (Cumulative Proof):</tspan> Provides an objective, deterministic tie-breaking mechanism across millions of anonymous nodes without requiring all-to-all voting rounds.</text>
    <text x="25" y="121" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan fill="#f472b6" font-weight="bold">4. Economic Incentives &amp; Penalties:</tspan> Honest behavior is rewarded with block subsidies and transaction fees; attacking the network burns expensive electricity with zero return.</text>
  </g>
</svg>