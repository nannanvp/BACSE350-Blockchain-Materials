<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="clustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="dustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="petGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="860" rx="16" fill="url(#bgGrad3)"/>
  <rect x="2" y="2" width="1196" height="856" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(60, 30)">
    <rect x="0" y="0" width="1080" height="70" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="540" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">BLOCKCHAIN PRIVACY ATTACKS &amp; DE-ANONYMIZATION</text>
    <text x="540" y="52" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">How Heuristic Clustering, Network Sniffing, and Taint Analysis Unmask Pseudonymous Ledger Identities</text>
  </g>

  <!-- Panel 1: Multi-Input Clustering Heuristic (Top Left) -->
  <g transform="translate(60, 120)" filter="url(#shadow3)">
    <rect x="0" y="0" width="525" height="230" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="0" y="0" width="525" height="34" rx="10" fill="url(#clustGrad)"/>
    <text x="18" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. Common-Input Ownership Heuristic (Address Clustering)</text>
    
    <!-- Visual Tx Box -->
    <g transform="translate(25, 55)">
      <!-- Inputs -->
      <rect x="0" y="0" width="130" height="40" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
      <text x="65" y="18" fill="#C4B5FD" font-family="monospace" font-size="11" text-anchor="middle">Input A1</text>
      <text x="65" y="32" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">0.75 BTC (UTXO)</text>

      <rect x="0" y="55" width="130" height="40" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
      <text x="65" y="73" fill="#C4B5FD" font-family="monospace" font-size="11" text-anchor="middle">Input A2</text>
      <text x="65" y="87" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">1.25 BTC (UTXO)</text>

      <!-- Tx Arrow -->
      <path d="M 135 20 L 195 47 L 225 47" fill="none" stroke="#A78BFA" stroke-width="2"/>
      <path d="M 135 75 L 195 47" fill="none" stroke="#A78BFA" stroke-width="2"/>

      <!-- Tx Center Node -->
      <circle cx="235" cy="47" r="14" fill="#6D28D9" stroke="#C4B5FD" stroke-width="1.5"/>
      <text x="235" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Tx</text>

      <!-- Output -->
      <line x1="250" y1="47" x2="310" y2="47" stroke="#A78BFA" stroke-width="2"/>
      <rect x="315" y="27" width="140" height="40" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="385" y="45" fill="#38BDF8" font-family="monospace" font-size="11" text-anchor="middle">Output: Merchant</text>
      <text x="385" y="59" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">2.00 BTC</text>
    </g>

    <!-- Deductions -->
    <g transform="translate(25, 165)">
      <rect x="0" y="0" width="475" height="50" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#E9D5FF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">&#8658; Cryptographic Inference:</text>
      <text x="12" y="38" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Signing this Tx requires private keys for BOTH A1 and A2. Clustered to the same entity!</text>
    </g>
  </g>

  <!-- Panel 2: Change Address Detection (Top Right) -->
  <g transform="translate(615, 120)" filter="url(#shadow3)">
    <rect x="0" y="0" width="525" height="230" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="525" height="34" rx="10" fill="#0284C7"/>
    <text x="18" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. Change Address Detection (Shadow Heuristic)</text>

    <!-- Visual Diagram -->
    <g transform="translate(25, 55)">
      <!-- Input -->
      <rect x="0" y="27" width="130" height="40" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="65" y="45" fill="#7DD3FC" font-family="monospace" font-size="11" text-anchor="middle">Alice UTXO</text>
      <text x="65" y="59" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">5.0000 BTC</text>

      <!-- Tx Arrow -->
      <line x1="135" y1="47" x2="200" y2="47" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="210" cy="47" r="14" fill="#0369A1" stroke="#7DD3FC" stroke-width="1.5"/>
      <text x="210" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Tx</text>

      <!-- Outputs -->
      <path d="M 225 47 L 275 20 L 305 20" fill="none" stroke="#38BDF8" stroke-width="2"/>
      <rect x="310" y="0" width="150" height="40" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <text x="385" y="18" fill="#6EE7B7" font-family="monospace" font-size="11" text-anchor="middle">Bob (Payment)</text>
      <text x="385" y="32" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">1.0000 BTC (Round)</text>

      <path d="M 225 47 L 275 75 L 305 75" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <rect x="310" y="55" width="150" height="40" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <text x="385" y="73" fill="#FDE68A" font-family="monospace" font-size="11" text-anchor="middle">New Addr C (Change)</text>
      <text x="385" y="87" fill="#F59E0B" font-family="monospace" font-size="9" text-anchor="middle">3.9995 BTC (Odd)</text>
    </g>

    <!-- Deductions -->
    <g transform="translate(25, 165)">
      <rect x="0" y="0" width="475" height="50" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#BAE6FD" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">&#8658; Heuristic Rule:</text>
      <text x="12" y="38" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Round amount goes to recipient; newly created address with odd balance is Alice's change wallet!</text>
    </g>
  </g>

  <!-- Panel 3: Network Sniffing & First Broadcast IP (Middle Left) -->
  <g transform="translate(60, 370)" filter="url(#shadow3)">
    <rect x="0" y="0" width="525" height="230" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="0" y="0" width="525" height="34" rx="10" fill="url(#netGrad)"/>
    <text x="18" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Network-Level Sniffing &amp; First-Broadcast Node Mapping</text>

    <!-- Diagram -->
    <g transform="translate(25, 55)">
      <!-- Alice Origin Node -->
      <rect x="0" y="15" width="115" height="48" rx="6" fill="#0F172A" stroke="#EC4899" stroke-width="1.5"/>
      <text x="57" y="33" fill="#F472B6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Alice's PC</text>
      <text x="57" y="48" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">IP: 203.0.113.19</text>

      <!-- Broadcast lines to listener -->
      <path d="M 120 39 L 195 39" fill="none" stroke="#EC4899" stroke-width="2"/>
      
      <!-- Adversary Listening Node -->
      <g transform="translate(200, 5)">
        <rect x="0" y="0" width="130" height="68" rx="8" fill="#701A75" stroke="#F472B6" stroke-width="1.5"/>
        <text x="65" y="20" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">&#128065; Gossip Sniffer</text>
        <text x="65" y="37" fill="#FBCFE8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Earliest Timestamp</text>
        <text x="65" y="53" fill="#FBCFE8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">T_0: First Seen</text>
      </g>

      <!-- Propagates to network -->
      <path d="M 335 39 L 380 39" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="385" y="15" width="100" height="48" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="435" y="35" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">P2P Network</text>
      <text x="435" y="50" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Gossip Flooding</text>
    </g>

    <!-- Deductions -->
    <g transform="translate(25, 155)">
      <rect x="0" y="0" width="475" height="58" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#FBCFE8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">&#8658; De-Anonymization Threat:</text>
      <text x="12" y="36" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Even if Alice uses a fresh address, listening supernodes across the gossip topology record the source IP of the first TCP broadcast, revealing Alice's ISP and physical city.</text>
    </g>
  </g>

  <!-- Panel 4: Dusting Attacks & Taint Analysis (Middle Right) -->
  <g transform="translate(615, 370)" filter="url(#shadow3)">
    <rect x="0" y="0" width="525" height="230" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="0" y="0" width="525" height="34" rx="10" fill="url(#dustGrad)"/>
    <text x="18" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">4. Dusting Attack &amp; UTXO Taint Tracking</text>

    <!-- Diagram -->
    <g transform="translate(25, 50)">
      <!-- Attacker sends dust -->
      <rect x="0" y="0" width="120" height="36" rx="6" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
      <text x="60" y="16" fill="#FEF3C7" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Attacker</text>
      <text x="60" y="29" fill="#FDE68A" font-family="monospace" font-size="9" text-anchor="middle">Sends 546 satoshis</text>

      <path d="M 125 18 L 175 18" fill="none" stroke="#F59E0B" stroke-width="2"/>
      
      <!-- Victim Address -->
      <rect x="180" y="0" width="130" height="36" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <text x="245" y="16" fill="#FDE68A" font-family="monospace" font-size="10" text-anchor="middle">Victim Address 1</text>
      <text x="245" y="29" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Holds 546 sat "dust"</text>

      <!-- Sweep Tx -->
      <path d="M 245 40 L 245 65" fill="none" stroke="#EF4444" stroke-width="2"/>
      <text x="250" y="58" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">Consolidated</text>

      <g transform="translate(140, 70)">
        <rect x="0" y="0" width="220" height="42" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
        <text x="110" y="16" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Consolidation Tx (Sweep)</text>
        <text x="110" y="32" fill="#CBD5E1" font-family="monospace" font-size="9" text-anchor="middle">Dust merged with Address 2 + 3</text>
      </g>
    </g>

    <!-- Deductions -->
    <g transform="translate(25, 155)">
      <rect x="0" y="0" width="475" height="58" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">&#8658; Taint Tracking:</text>
      <text x="12" y="36" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">When the victim spends or sweeps wallet funds, the dust UTXO is co-signed with their personal cold wallets, immediately exposing the complete portfolio to blockchain intelligence tools.</text>
    </g>
  </g>

  <!-- Bottom Panel: De-Anonymization Synthesis & Privacy Defense (PETs) -->
  <g transform="translate(60, 620)" filter="url(#shadow3)">
    <rect x="0" y="0" width="1080" height="210" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="1080" height="34" rx="12" fill="url(#petGrad)"/>
    <text x="540" y="23" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">&#128272; THE DE-ANONYMIZATION CORRELATION MATRIX &amp; PRIVACY-ENHANCING TECHNIQUES (PETs)</text>

    <!-- Sub-panel Left: Correlation Matrix -->
    <g transform="translate(25, 48)">
      <rect x="0" y="0" width="495" height="145" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Identity Correlation Pipeline (How Anonymity Dies)</text>
      <text x="16" y="44" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">1. <tspan fill="#38BDF8" font-weight="600">On-Chain Graph:</tspan> Multi-input clustering links 14 addresses into 1 cluster</text>
      <text x="16" y="66" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">2. <tspan fill="#F59E0B" font-weight="600">KYC Touchpoints:</tspan> Cluster withdraws 0.2 BTC from a regulated CEX (Coinbase)</text>
      <text x="16" y="88" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">3. <tspan fill="#EC4899" font-weight="600">Web3 Fingerprints:</tspan> One clustered address registered an ENS domain (alice.eth)</text>
      <text x="16" y="110" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">4. <tspan fill="#A78BFA" font-weight="600">Timing Correlation:</tspan> Twitter post "Bought coffee!" matches on-chain merchant Tx</text>
      <text x="16" y="132" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#8658; Result: Real-world person identified with 100% mathematical certainty.</text>
    </g>

    <!-- Sub-panel Right: PETs Countermeasures -->
    <g transform="translate(545, 48)">
      <rect x="0" y="0" width="510" height="145" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
      <text x="16" y="22" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Privacy-Enhancing Technologies (PETs) Countermeasures</text>
      <text x="16" y="44" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; <tspan fill="#34D399" font-weight="600">Zero-Knowledge Proofs (zk-SNARKs):</tspan> Prove validity without revealing amounts or keys (Zcash).</text>
      <text x="16" y="66" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; <tspan fill="#34D399" font-weight="600">Ring Signatures (MLSAG/CLSAG):</tspan> Obfuscates real signer among decoy keys (Monero).</text>
      <text x="16" y="88" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; <tspan fill="#34D399" font-weight="600">Stealth Addresses (ECDH):</tspan> Dynamically generates one-time addresses per payment.</text>
      <text x="16" y="110" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; <tspan fill="#34D399" font-weight="600">Confidential Transactions:</tspan> Cryptographically conceals transferred amounts via Pedersen commitments.</text>
      <text x="16" y="132" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; <tspan fill="#34D399" font-weight="600">CoinJoin (Wasabi / Whirlpool):</tspan> Multi-party transaction mixing breaking common-input heuristics.</text>
    </g>
  </g>
</svg>